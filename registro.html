```html
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear cuenta - Real Madrid CF</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #111827;
        }

        header {
            background: #0b1f4b;
            color: white;
            padding: 20px;
        }

        .header-contenido {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        header a {
            color: #0b1f4b;
            background: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .registro {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .registro h2 {
            color: #0b1f4b;
            margin-bottom: 10px;
            text-align: center;
        }

        .registro > p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .campo input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .campo input:focus {
            outline: none;
            border-color: #0b1f4b;
        }

        .boton {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #0b1f4b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton:hover {
            background: #162f68;
        }

        .boton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #mensaje {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #0b1f4b;
            font-weight: bold;
        }

    </style>

</head>


<body>


<header>

    <div class="header-contenido">

        <h1>
            REAL MADRID CF
        </h1>

        <a href="index.html">
            Volver a la web
        </a>

    </div>

</header>


<main>

    <div class="registro">

        <h2>
            Crear cuenta
        </h2>

        <p>
            Regístrate para continuar
        </p>


        <form id="registroForm">


            <div class="campo">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Tu nombre"
                    required
                >

            </div>


            <div class="campo">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="tu@email.com"
                    required
                >

            </div>


            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Mínimo 6 caracteres"
                    minlength="6"
                    required
                >

            </div>


            <div class="campo">

                <label for="password2">
                    Repetir contraseña
                </label>

                <input
                    type="password"
                    id="password2"
                    placeholder="Repite tu contraseña"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="boton"
                id="botonRegistro"
            >
                Crear cuenta
            </button>


            <p id="mensaje"></p>


        </form>


        <div class="login">

            ¿Ya tienes una cuenta?

            <a href="login.html">
                Iniciar sesión
            </a>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
    "https://rbqlhhvemtdjqllicssu.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_w3g8OlmHtSXcv5_Iur1jyw_u_oQTmPM";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const formulario =
    document.getElementById(
        "registroForm"
    );


const mensaje =
    document.getElementById(
        "mensaje"
    );


const boton =
    document.getElementById(
        "botonRegistro"
    );


formulario.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const nombre =
            document.getElementById(
                "nombre"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const password2 =
            document.getElementById(
                "password2"
            ).value;


        if (password !== password2) {

            mensaje.textContent =
                "Las contraseñas no coinciden.";

            mensaje.style.color =
                "red";

            return;

        }


        if (password.length < 6) {

            mensaje.textContent =
                "La contraseña debe tener al menos 6 caracteres.";

            mensaje.style.color =
                "red";

            return;

        }


        boton.disabled = true;

        boton.textContent =
            "Creando cuenta...";

        mensaje.textContent =
            "";


        /*
         * CREAR USUARIO EN SUPABASE AUTH
         */

        const {
            data,
            error
        } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password

            });


        if (error) {

            console.error(error);

            mensaje.textContent =
                error.message;

            mensaje.style.color =
                "red";

            boton.disabled = false;

            boton.textContent =
                "Crear cuenta";

            return;

        }


        /*
         * GUARDAR DATOS ADICIONALES
         * EN LA TABLA perfiles
         */

        if (data.user) {


            const {
                error: errorPerfil
            } =
                await supabaseClient
                    .from("perfiles")
                    .insert([

                        {
                            id:
                                data.user.id,

                            nombre:
                                nombre,

                            email:
                                email
                        }

                    ]);


            if (errorPerfil) {

                console.error(
                    errorPerfil
                );

                mensaje.textContent =
                    "La cuenta se creó, pero no se pudo guardar el perfil.";

                mensaje.style.color =
                    "red";

                boton.disabled = false;

                boton.textContent =
                    "Crear cuenta";

                return;

            }

        }


        mensaje.textContent =
            "Cuenta creada correctamente.";

        mensaje.style.color =
            "green";


        formulario.reset();


        boton.disabled = false;

        boton.textContent =
            "Crear cuenta";

    }
);

</script>


</body>

</html>
